<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Britespite</title>
<meta name="description" content="Britespite: a free-camera spear army battle test.">
<style>
  :root { --accent:#d8a63a; --ink:#14120f; --paper:#f2ecde; --muted:#b9b09b; --panel:rgba(20,18,15,.82); --teamA:#b3352b; --teamB:#2f5f9a;
    --display:"Rockwell","Roboto Slab",Georgia,serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#8fa3ab; overflow:hidden; font-family:var(--mono); color:var(--paper); touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hud { position:fixed; left:max(12px,env(safe-area-inset-left)); top:max(12px,env(safe-area-inset-top)); display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .title { font:700 22px/1 var(--display); letter-spacing:.02em; text-shadow:0 1px 3px #000a; }
  .title small { display:block; font:400 12px var(--mono); color:var(--paper); opacity:.9; margin-top:4px; }
  .tally { display:flex; gap:8px; }
  .tally div { background:var(--panel); padding:6px 10px; border-left:5px solid; font-size:14px; min-width:96px; }
  .tally .a { border-color:var(--teamA); } .tally .b { border-color:var(--teamB); }
  .tally b { font-size:18px; display:block; }
  .panel { background:var(--panel); padding:6px 10px; font-size:12px; width:max-content; max-width:80vw; }
  .panel table { border-collapse:collapse; } .panel th { font-weight:400; color:var(--muted); text-align:left; padding:2px 10px 2px 0; } .panel td, .panel thead th:not(:first-child) { text-align:right; padding:2px 0 2px 14px; font-variant-numeric:tabular-nums; }
  .panel thead th:nth-child(2) { color:var(--teamA); } .panel thead th:nth-child(3) { color:var(--teamB); }
  .split { display:flex; height:5px; margin-top:5px; background:#0006; } .split i { display:block; height:100%; transition:width .3s; } #bara { background:var(--teamA); } #barb { background:var(--teamB); }
  .swatch { min-width:44px; padding:0 10px; display:inline-flex; align-items:center; gap:6px; } .swatch i { width:14px; height:14px; border:1px solid #fff8; display:inline-block; }
  @media (prefers-reduced-motion:reduce) { .split i { transition:none; } }
  .stats { background:var(--panel); padding:6px 10px; font-size:12px; color:var(--muted); width:max-content; max-width:80vw; white-space:pre; }
  .bar { position:fixed; right:max(12px,env(safe-area-inset-right)); top:max(12px,env(safe-area-inset-top)); display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:60vw; }
  button, select { font:600 14px var(--mono); color:var(--paper); background:var(--panel); border:1px solid #6b6455; padding:0 12px; min-height:44px; min-width:44px; cursor:pointer; border-radius:2px; }
  button:hover, select:hover { border-color:var(--accent); }
  button:focus-visible, select:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button[aria-pressed="true"] { background:var(--accent); color:var(--ink); border-color:var(--accent); }
  .hint { position:fixed; left:50%; bottom:max(20px,env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--panel); border-top:3px solid var(--accent); padding:12px 16px; font-size:15px; max-width:min(520px,92vw); text-align:center; transition:opacity .6s; }
  .hint.off { opacity:0; pointer-events:none; }
  .banner { position:fixed; left:50%; top:30%; transform:translate(-50%,-50%); font:700 clamp(28px,6vw,56px) var(--display); text-shadow:0 2px 8px #000b; display:none; text-align:center; }
  .stick { position:fixed; left:max(18px,env(safe-area-inset-left)); bottom:max(22px,env(safe-area-inset-bottom)); width:132px; height:132px; border-radius:50%; border:2px solid #f2ecde88; background:#14120f55; display:none; }
  .stick i { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px; border-radius:50%; background:#f2ecdecc; }
  .pad { position:fixed; right:max(18px,env(safe-area-inset-right)); bottom:max(22px,env(safe-area-inset-bottom)); display:none; flex-direction:column; gap:8px; }
  .pad button { min-width:60px; min-height:60px; font-size:20px; }
  #cmdfx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; display:none; }
  .cmd { position:fixed; left:50%; bottom:max(20px,env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; width:max-content; max-width:calc(100vw - 24px); }
  .cmd[hidden] { display:none; }
  .cmd .row { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .cmd button { min-height:48px; padding:0 14px; } .cmd button kbd { font:400 11px var(--mono); opacity:.7; margin-left:6px; } .cmd button:disabled { opacity:.4; cursor:default; }
  .cmdlabel { background:var(--panel); border-top:3px solid var(--accent); padding:8px 14px; font-size:14px; text-align:center; max-width:92vw; } .cmdlabel b { color:var(--accent); }
  @media (pointer:coarse) { .cmd { bottom:max(170px,calc(env(safe-area-inset-bottom) + 160px)); } .cmd kbd { display:none; } }
  @media (pointer:coarse) { .stick { display:block; } .pad { display:flex; } .keys { display:none; } .hint { bottom:180px; } }
  @media (max-width:520px) { .bar { max-width:100%; left:12px; right:12px; top:auto; bottom:auto; margin-top:150px; justify-content:flex-start; } .tally div { min-width:80px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud">
  <div class="title">Britespite<small>spear army battle test</small></div>
  <div class="tally"><div class="a"><span id="na">Crimson</span><b id="ca">0</b></div><div class="b"><span id="nb">Azure</span><b id="cb">0</b></div></div>
  <div class="panel" id="panel" hidden>
    <table><thead><tr><th></th><th id="ha">Crimson</th><th id="hb">Azure</th></tr></thead><tbody>
      <tr><th>Standing</th><td id="sa">0</td><td id="sb">0</td></tr>
      <tr><th>Kills</th><td id="ka">0</td><td id="kb">0</td></tr>
      <tr><th>Casualties</th><td id="xa">0</td><td id="xb">0</td></tr>
      <tr><th>Strength</th><td id="pa">100%</td><td id="pb">100%</td></tr>
    </tbody></table>
    <div class="split"><i id="bara"></i><i id="barb"></i></div>
  </div>
  <div class="stats" id="stats"></div>
</div>
<div class="bar">
  <button id="cmdtoggle" aria-pressed="false" title="Command mode (Tab)">Command</button>
  <button id="pause" aria-pressed="false" title="Pause (P)">Pause</button>
  <button id="ff" aria-pressed="false" title="Fast forward (F)">1×</button>
  <button id="mute" aria-pressed="true" title="Sound (M)">Sound off</button>
  <select id="size" aria-label="Army size per side"></select>
  <button id="statsBtn" aria-pressed="true" title="Battle stats (T)">Stats</button>
  <button id="colA" class="swatch" title="Change left army colour"><i id="swA"></i>L</button>
  <button id="colB" class="swatch" title="Change right army colour"><i id="swB"></i>R</button>
  <button id="restart" title="Restart (R)">Restart</button>
  <button id="help" title="Help (H)">?</button>
</div>
<canvas id="cmdfx"></canvas>
<div class="cmd" id="cmd" hidden>
  <div class="cmdlabel"><b id="cmdcount">0</b> <span id="cmdlabel"></span></div>
  <div class="row">
    <button id="c-adv" disabled>Advance<kbd>4</kbd></button><button id="c-hold" disabled>Hold<kbd>5</kbd></button>
    <button id="c-fl" disabled>Flank ◀<kbd>6</kbd></button><button id="c-fr" disabled>Flank ▶<kbd>7</kbd></button>
    <button id="c-all">All<kbd>9</kbd></button><button id="c-clr" disabled>Clear<kbd>0</kbd></button>
  </div>
</div>
<div class="banner" id="banner"></div>
<div class="hint" id="hint"></div>
<div class="stick" id="stick"><i id="knob"></i></div>
<div class="pad"><button id="up" aria-label="Fly up">▲</button><button id="down" aria-label="Fly down">▼</button><button id="fast" aria-pressed="false" aria-label="Fast">»</button></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
