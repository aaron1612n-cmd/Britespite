<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Britespite</title>
<meta name="description" content="Britespite: a free-camera spear army battle test.">

</head>
<body>
<canvas id="view"></canvas>
<div class="hud">
  <header class="title"><h1>Britespite</h1><span>Spear armies, free camera</span></header>
  <section class="ledger" aria-label="Battle score">
    <div class="side a"><span id="na">Crimson</span><b id="ca">0</b></div>
    <div class="side b"><span id="nb">Azure</span><b id="cb">0</b></div>
  </section>
  <div class="panel" id="panel" hidden>
    <table><thead><tr><th></th><th id="ha">Crimson</th><th id="hb">Azure</th></tr></thead><tbody>
      <tr><th>Standing</th><td id="sa">0</td><td id="sb">0</td></tr>
      <tr><th>Kills</th><td id="ka">0</td><td id="kb">0</td></tr>
      <tr><th>Casualties</th><td id="xa">0</td><td id="xb">0</td></tr>
      <tr><th>Strength</th><td id="pa">100%</td><td id="pb">100%</td></tr>
    </tbody></table>
    <div class="split"><i id="bara"></i><i id="barb"></i></div>
  </div>
  <div class="camstat" id="camstat"><span id="ctext"></span><button id="cview"></button><button id="cspeed"></button><button id="cfree">Free cam</button></div>
  <div class="stats" id="stats"></div>
</div>
<nav class="bar" aria-label="Controls">
  <div class="group">
    <button id="cmdtoggle" aria-pressed="false" title="Command mode (Tab)">Command</button>
    <button id="cine" aria-pressed="false" title="Cinematic camera (K)">Cinema</button>
    <button id="replay" aria-pressed="false" title="Replay last seconds (Y)">Replay</button>
  </div>
  <div class="group">
    <button id="pause" aria-pressed="false" title="Pause (P)">Pause</button>
    <button id="ff" aria-pressed="false" title="Fast forward (F)">1×</button>
    <button id="mute" aria-pressed="true" title="Sound (M)">Sound off</button>
  </div>
  <div class="group">
    <button id="setupBtn" aria-pressed="false" aria-expanded="false" aria-controls="setup" title="Battle setup">Setup</button>
    <button id="help" title="Help (H)" aria-label="Help">?</button>
  </div>
  <div class="setup" id="setup" hidden>
    <fieldset><legend>Battle</legend>
      <label>Scenario<select id="mode" aria-label="Scenario"><option value="open">Open field</option><option value="siege">Siege</option></select></label>
      <label>Army size<select id="size" aria-label="Army size per side"></select></label>
      <label>Left formation<select id="fa" aria-label="Left army formation"></select></label>
      <label>Right formation<select id="fb" aria-label="Right army formation"></select></label>
      <label>Left troops<select id="ma" aria-label="Left army troops"></select></label>
      <label>Right troops<select id="mb" aria-label="Right army troops"></select></label>
      <div class="colours"><span>Colours</span><button id="colA" class="swatch" title="Change left army colour"><i id="swA"></i>Left</button><button id="colB" class="swatch" title="Change right army colour"><i id="swB"></i>Right</button></div>
    </fieldset>
    <fieldset><legend>Field</legend>
      <label>Terrain<select id="terrain" aria-label="Terrain"></select></label>
      <label>Weather<select id="weather" aria-label="Weather"></select></label>
      <label>Time of day<select id="time" aria-label="Time of day"></select></label>
    </fieldset>
    <div class="actions"><button id="statsBtn" aria-pressed="true" title="Battle stats (T)">Stats</button><button id="restart" title="Restart (R)">Restart</button></div>
  </div>
</nav>
<canvas id="cmdfx"></canvas>
<div class="cmd" id="cmd" hidden>
  <div class="cmdlabel"><b id="cmdcount">0</b> <span id="cmdlabel"></span></div>
  <div class="row">
    <button id="c-adv" disabled>Advance<kbd>4</kbd></button><button id="c-hold" disabled>Hold<kbd>5</kbd></button>
    <button id="c-fl" disabled>Flank ◀<kbd>6</kbd></button><button id="c-fr" disabled>Flank ▶<kbd>7</kbd></button>
    <button id="c-all">All<kbd>9</kbd></button><button id="c-clr" disabled>Clear<kbd>0</kbd></button>
  </div>
</div>
<div class="banner" id="banner"></div>
<div class="hint" id="hint"></div>
<div class="stick" id="stick"><i id="knob"></i></div>
<div class="pad"><button id="up" aria-label="Fly up">▲</button><button id="down" aria-label="Fly down">▼</button><button id="fast" aria-pressed="false" aria-label="Fast">»</button></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
